<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجّل جمعيتك في الخدمة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12302f;--teal:#0f6b66;--mist:#edf3f2;--line:#cddad8;--sand:#c8a24a;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--mist);color:var(--ink);line-height:1.7}
main{max-width:560px;margin:0 auto;padding:32px 18px 48px}
h1{font-size:28px;margin:0 0 6px;line-height:1.3}
.lead{margin:0 0 22px;color:#44605e}
form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
label{display:block;font-weight:600;margin:14px 0 4px;font-size:15px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--sand);outline-offset:1px}
.err{color:var(--err);font-size:13px;min-height:18px}
button{width:100%;margin-top:20px;padding:13px;font:inherit;font-weight:700;font-size:17px;background:var(--teal);color:#fff;border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.6}
.social{margin-top:26px;text-align:center}
.social p{margin:0 0 10px;color:#44605e}
.social a{display:inline-block;margin:4px;padding:8px 16px;border:1px solid var(--teal);border-radius:999px;color:var(--teal);text-decoration:none;font-weight:600}
.social a:hover{background:var(--teal);color:#fff}
#done{display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
#done h2{margin:0 0 8px}
</style>

<!-- Microsoft Clarity -->
<script type="text/javascript">
  (function(c,l,a,r,i,t,y){
    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
    y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
  })(window, document, "clarity", "script", "yu52xk45d7");
</script>
<!-- Microsoft Clarity -->

</head>
<body>
<main>
  <h1>سجّل جمعيتك في الخدمة</h1>
  <p class="lead">أدخل بيانات جمعيتك في الرياض وسيتواصل معك فريقنا. يستغرق التسجيل أقل من دقيقتين.</p>

  <form id="f" novalidate>
    <label for="charity_name">اسم الجمعية</label>
    <input id="charity_name" name="charity_name" required autocomplete="organization">
    <div class="err"></div>

    <label for="activity_type">نوع النشاط</label>
    <select id="activity_type" name="activity_type" required>
      <option value="">اختر</option><option>إغاثية</option><option>تعليمية</option><option>صحية</option>
      <option>رعاية الأيتام</option><option>تحفيظ القرآن</option><option>أخرى</option>
    </select>
    <div class="err"></div>

    <label for="district">الحي في الرياض</label>
    <input id="district" name="district" required>
    <div class="err"></div>

    <label for="contact_name">اسم المسؤول</label>
    <input id="contact_name" name="contact_name" required autocomplete="name">
    <div class="err"></div>

    <label for="phone">رقم الجوال</label>
    <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="05xxxxxxxx" required autocomplete="tel" dir="ltr" style="text-align:right">
    <div class="err"></div>

    <label for="email">البريد الإلكتروني</label>
    <input id="email" name="email" type="email" required autocomplete="email" dir="ltr" style="text-align:right">
    <div class="err"></div>

    <label for="service">الخدمة المطلوبة</label>
    <select id="service" name="service" required>
      <option value="">اختر</option><option>إدارة الحملات</option><option>التسويق الرقمي</option>
      <option>التقارير والتحليل</option><option>أخرى</option>
    </select>
    <div class="err"></div>

    <label for="notes">ملاحظات (اختياري)</label>
    <textarea id="notes" name="notes" rows="3"></textarea>

    <button type="submit" id="btn">أرسل بيانات الجمعية</button>
  </form>

  <div id="done"><h2>وصلتنا بياناتك</h2><p>شكرًا لك. سنتواصل معك قريبًا.</p></div>

  <div class="social">
    <p>تابعنا على</p>
    <a href="https://www.instagram.com/" data-social="instagram" target="_blank" rel="noopener">Instagram</a>
    <a href="https://www.youtube.com/" data-social="youtube" target="_blank" rel="noopener">YouTube</a>
    <a href="https://www.snapchat.com/" data-social="snapchat" target="_blank" rel="noopener">Snapchat</a>
    <a href="https://www.tiktok.com/" data-social="tiktok" target="_blank" rel="noopener">TikTok</a>
    <a href="https://x.com/" data-social="x" target="_blank" rel="noopener">X</a>
  </div>
</main>

<script>
/* ===== الإعدادات: عدّل هاتين القيمتين فقط ===== */
const CFG = {
  CLARITY_ID: 'yu52xk45d7',   // من لوحة Microsoft Clarity
  SHEET_URL:  'https://script.google.com/macros/s/AKfycbzMLrEE80uVc3ZjeNDo2NTG5O1txGVZwMwL3aUUATxehgFMEDWBnktNiNZ369T2RHsuJQ/exec'                           // رابط Google Apps Script (ينتهي بـ /exec)
};
/* ============================================== */

// --- Microsoft Clarity ---
if (CFG.CLARITY_ID && !CFG.CLARITY_ID.startsWith('YOUR_')) {
  (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window,document,"clarity","script",CFG.CLARITY_ID);
}
const cl = (...a) => { try { window.clarity && window.clarity(...a); } catch(e){} };

// --- Session info ---
const P = new URLSearchParams(location.search);
const sid = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const t0 = Date.now();
const ua = navigator.userAgent;

function detectSource() {
  const u = P.get('utm_source') || P.get('src');
  if (u) return u.toLowerCase();
  const inApp = [['Instagram','instagram'],['TikTok','tiktok'],['musical_ly','tiktok'],['Snapchat','snapchat'],['FBAN','facebook'],['FBAV','facebook']];
  for (const [k, v] of inApp) if (ua.includes(k)) return v;
  let h = ''; try { h = new URL(document.referrer).hostname; } catch(e){}
  const m = {instagram:'instagram',tiktok:'tiktok',snapchat:'snapchat',youtube:'youtube','t.co':'x',twitter:'x','x.com':'x',google:'google',mail:'email',outlook:'email'};
  for (const k in m) if (h.includes(k)) return m[k];
  return h || 'direct';
}

const S = {
  session_id: sid, status: 'visited', first_seen: new Date(t0).toISOString(),
  source: detectSource(), medium: P.get('utm_medium') || '', campaign: P.get('utm_campaign') || '',
  referrer: document.referrer || '', landing_url: location.href,
  device: /Mobi|Android|iPhone/i.test(ua) ? 'mobile' : 'desktop', user_agent: ua,
  screen: screen.width + 'x' + screen.height, language: navigator.language,
  timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
};
const stats = {}, clicks = [];
let startedAt = null, lastField = '', cur = null, curT = 0, timer = null, submitted = false;

const form = document.getElementById('f');
const names = [...form.elements].filter(e => e.name).map(e => e.name);
names.forEach(n => stats[n] = {t: 0, n: 0, c: 0});

// Clarity tags: filter recordings by source, status, last field
cl('set', 'source', S.source);
if (S.campaign) cl('set', 'campaign', S.campaign);
cl('set', 'device_type', S.device);

function snapshot() {
  const now = Date.now();
  const d = {...S};
  d.time_on_page_s = Math.round((now - t0) / 1000);
  d.time_to_start_s = startedAt ? Math.round((startedAt - t0) / 1000) : '';
  d.last_field = lastField;
  d.fields_filled = names.filter(n => form.elements[n].value.trim()).join(',');
  const st = JSON.parse(JSON.stringify(stats));
  if (cur) st[cur].t += (now - curT) / 1000;
  for (const k in st) st[k].t = Math.round(st[k].t);
  d.field_stats = st;
  d.clicks = clicks;
  names.forEach(n => { if (n !== 'phone' || true) d[n] = form.elements[n].value.trim(); });
  return d;
}

function send(beacon) {
  const body = JSON.stringify(snapshot());
  if (!CFG.SHEET_URL) { console.log('[demo - no SHEET_URL]', JSON.parse(body)); return; }
  if (beacon && navigator.sendBeacon) { navigator.sendBeacon(CFG.SHEET_URL, new Blob([body], {type: 'text/plain'})); return; }
  fetch(CFG.SHEET_URL, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body, keepalive: true}).catch(()=>{});
}
const later = () => { clearTimeout(timer); timer = setTimeout(() => send(false), 1200); };

// --- Field tracking ---
form.addEventListener('focusin', e => {
  const n = e.target.name; if (!n) return;
  if (!startedAt) { startedAt = Date.now(); S.status = 'started'; cl('event', 'form_start'); cl('set', 'form_status', 'started'); send(false); }
  cur = n; curT = Date.now(); lastField = n; stats[n].n++;
  cl('event', 'field_' + n); cl('set', 'last_field', n);
});
form.addEventListener('focusout', e => {
  const n = e.target.name; if (!n || cur !== n) return;
  stats[n].t += (Date.now() - curT) / 1000; cur = null; later();
});
form.addEventListener('input', e => { if (stats[e.target.name]) stats[e.target.name].c++; later(); });

// --- Social clicks ---
document.querySelectorAll('[data-social]').forEach(a => a.addEventListener('click', () => {
  const s = a.dataset.social;
  clicks.push({s, at: Math.round((Date.now() - t0) / 1000)});
  cl('event', 'click_' + s);
  send(true);
}));

// --- Leaving the page ---
function leave() {
  if (submitted) return;
  S.status = startedAt ? 'abandoned' : 'left_without_starting';
  cl('set', 'form_status', S.status);
  send(true);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') leave(); });
addEventListener('pagehide', leave);
addEventListener('pageshow', () => { if (!submitted) S.status = startedAt ? 'started' : 'visited'; });

// --- Validation + submit ---
const rules = {phone: v => /^(05\d{8}|\+9665\d{8})$/.test(v.replace(/\s/g, '')) || 'رقم الجوال غير صحيح، مثال: 0512345678'};
form.addEventListener('submit', e => {
  e.preventDefault();
  let ok = true, firstBad = null;
  names.forEach(n => {
    const el = form.elements[n], box = el.nextElementSibling, v = el.value.trim();
    let msg = '';
    if (el.required && !v) msg = 'هذا الحقل مطلوب';
    else if (v && el.type === 'email' && !el.checkValidity()) msg = 'البريد الإلكتروني غير صحيح';
    else if (v && rules[n]) { const r = rules[n](v); if (r !== true) msg = r; }
    if (box && box.classList.contains('err')) box.textContent = msg;
    if (msg) { ok = false; firstBad = firstBad || el; cl('event', 'error_' + n); }
  });
  if (!ok) { firstBad.focus(); return; }
  submitted = true; S.status = 'submitted';
  S.time_to_submit_s = startedAt ? Math.round((Date.now() - startedAt) / 1000) : '';
  const snap = snapshot(); snap.time_to_submit_s = S.time_to_submit_s;
  document.getElementById('btn').disabled = true;
  cl('event', 'form_submit'); cl('set', 'form_status', 'submitted');
  send(false);
  form.style.display = 'none';
  document.getElementById('done').style.display = 'block';
});
send(false); // record the visit itself
</script>
</body>
</html>
